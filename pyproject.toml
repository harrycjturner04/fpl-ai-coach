[project]
name = "fpl-ai-coach"
version = "0.1.0"
description = "AI-assisted Fantasy Premier League coach: prediction + ILP optimisation + LLM reasoning."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "pulp>=3.3,<4",  # <4: 4.0 drops the bundled CBC solver
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:PULP_CBC_CMD is deprecated:DeprecationWarning"]
